spring.application.name=apollo-clinicare-api
server.port=8080
# All endpoints live under /api  (frontend: NEXT_PUBLIC_API_URL=http://localhost:8080/api)
server.servlet.context-path=/api

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apollo_care?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# run data.sql AFTER Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- App settings ----------
# JWT secret must be at least 32 characters. Override with the JWT_SECRET env var in real use.
app.jwt.secret=${JWT_SECRET:apollo-care-dev-secret-change-me-please-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# When false, nobody can self-register as admin from the register page
app.allow-admin-registration=${ALLOW_ADMIN_REGISTRATION:false}
# Default admin created on first start if it does not exist (change the password!)
app.admin.name=Admin
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Set ADMIN_RESET_PASSWORD=true for one start if you forgot the admin password (then remove it)
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}

# ---------- Professional extras ----------
# API docs (Swagger UI): http://localhost:8080/api/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Health check for monitoring: http://localhost:8080/api/actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Never leak stack traces / internal messages to API clients
server.error.include-stacktrace=never
server.error.include-message=never
# Compress JSON responses
server.compression.enabled=true
# Clean logs
logging.level.root=INFO
logging.level.com.apollocare=INFO
spring.jackson.default-property-inclusion=non_null

# ---------- Booking rules ----------
# Appointments are validated against this time zone (so "today" is never wrong because the server runs in UTC)
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# How many days ahead a patient may book
app.booking.max-days-ahead=${BOOKING_MAX_DAYS:60}

# ---------- Demo doctor logins ----------
# Every doctor without a login gets <name>@apollocare.com with this password. Set to false for production.
app.seed-doctor-logins.enabled=${SEED_DOCTOR_LOGINS:true}
app.seed-doctor-logins.password=${SEED_DOCTOR_PASSWORD:Doctor@123}

# ---------- Medical file uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Files are saved here (relative to where the backend is started). Back this folder up with the database.
app.upload-dir=${UPLOAD_DIR:./uploads/medical-records}

# ---------- AI reading of uploaded files (Claude) ----------
# Put your Anthropic API key in the ANTHROPIC_API_KEY environment variable (never commit it to the code).
app.ai.enabled=${AI_ANALYSIS_ENABLED:true}
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-sonnet-5-5}
app.ai.timeout-seconds=90

# ---------- FAQ chat assistant ----------
# Uses the same ANTHROPIC_API_KEY as the medical-file reading. Without a key it answers from built-in FAQ replies.
# Public endpoint, so it is rate limited (per visitor and overall).
app.chat.max-per-window=${CHAT_MAX_PER_WINDOW:20}
app.chat.window-minutes=${CHAT_WINDOW_MINUTES:10}
app.chat.global-per-hour=${CHAT_GLOBAL_PER_HOUR:300}
